{% extends 'base.html' %}{% block content %}<section class="section narrow"><a href="{% url 'address_book' %}">Back to your addresses</a><h1>{% if address %}Edit address{% else %}Save an address{% endif %}</h1><form id="checkout-form" method="post">{% csrf_token %}{{ address_form.non_field_errors }}<label>Address label<input name="label" maxlength="60" value="{{ address_label }}" placeholder="Home, Work or Campus" required></label><div class="basket-delivery">{% include 'delivery_address.html' %}</div><label><input type="checkbox" name="is_default" {% if address.is_default %}checked{% endif %}> Use as my default delivery address</label><p><button class="button dark">Save address</button></p></form></section>{% endblock %}
