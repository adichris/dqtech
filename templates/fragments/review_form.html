<form method="post" action="{% url 'submit_review' product.pk %}" id="review-form" hx-post="{% url 'submit_review' product.pk %}" hx-target="this" hx-swap="outerHTML" hx-status:422="target:#review-form" hx-disable="find button">{% csrf_token %}<fieldset class="review-rating-picker"><legend>Your rating</legend>{% for n in '12345' %}<label><input type="radio" name="rating" value="{{ n }}" required {% if form.rating.value|stringformat:'s' == n %}checked{% endif %}><span><i class="fa-solid fa-star" aria-hidden="true"></i></span><small>{{ n }}</small><span class="visually-hidden">{{ n }} out of 5 stars</span></label>{% endfor %}</fieldset>{{ form.rating.errors }}<label class="d-block my-3" for="id_title">A few words to sum it up{{ form.title }}</label>{{ form.title.errors }}<label class="d-block my-3" for="id_body">Tell us about your experience{{ form.body }}</label>{{ form.body.errors }}<button class="button dark" type="submit">Publish verified review <i class="fa-regular fa-paper-plane" aria-hidden="true"></i></button></form>
