<form method="post" action="{% url 'save_product' p.pk %}" class="save-form" hx-post="{% url 'save_product' p.pk %}" hx-target="this" hx-swap="outerHTML" hx-disable="find button">{% csrf_token %}<button class="icon-action {% if is_saved or p.pk in saved_product_ids %}saved{% endif %}" type="submit" aria-label="{% if is_saved or p.pk in saved_product_ids %}Remove {{ p.name }} from saved products{% else %}Save {{ p.name }}{% endif %}" aria-pressed="{% if is_saved or p.pk in saved_product_ids %}true{% else %}false{% endif %}"><i class="{% if is_saved or p.pk in saved_product_ids %}fa-solid{% else %}fa-regular{% endif %} fa-heart" aria-hidden="true"></i></button></form>
