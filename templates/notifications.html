{% extends 'base.html' %}{% block content %}<section class="section narrow">{% include 'fragments/account_nav.html' %}<div class="section-heading"><h1>Your updates</h1><form method="post">{% csrf_token %}<button class="button">Mark all read</button></form></div>{% for n in notifications %}<a class="panel d-block" href="{{ n.body|default:'#' }}"><strong>{% if not n.is_read %}● {% endif %}{{ n.subject }}</strong><small class="d-block mt-2">{{ n.date_sent }}</small></a>{% empty %}<p>You're all caught up.</p>{% endfor %}</section>{% endblock %}
